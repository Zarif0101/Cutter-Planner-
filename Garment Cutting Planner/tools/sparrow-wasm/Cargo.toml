[package]
name = "sparrow_wasm"
version = "0.2.0"
edition = "2024"
publish = false
description = "Browser bridge: runs the sparrow nesting heuristic (MIT, J. Gardeyn) inside Marker Planner"

# Built for wasm32-wasip1 with a plain C-style interface, so no generated JavaScript glue is needed:
# the page supplies the few WASI functions sparrow uses (clock, random numbers, logging).
#   cargo build --release --target wasm32-wasip1
#   then tools/sparrow-wasm/embed.ps1 puts the gzipped, base64 module into marker-planner.html

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# sparrow source unpacked from https://github.com/JeroenGar/sparrow (main, 0.3.0) to C:\Users\ayman\sparrow-build
sparrow = { path = "../../../../../sparrow-build/src/sparrow-main" }
jagua-rs = { version = "=2.0.0", features = ["spp"] }
serde_json = "1.0"
rand = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
